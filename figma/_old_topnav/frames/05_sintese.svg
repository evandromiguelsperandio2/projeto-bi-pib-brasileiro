<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<g id="fundo"><rect x="0.0" y="0.0" width="1280.0" height="720.0" rx="0" fill="#F9F9F7" stroke="none" stroke-width="1"/><rect x="0.0" y="0.0" width="1280.0" height="4.0" rx="0" fill="#2A78D6" stroke="none" stroke-width="1"/><line x1="32.0" y1="682.0" x2="1248.0" y2="682.0" stroke="#E1E0D9" stroke-width="1"/><rect x="32.0" y="96.0" width="384.0" height="250.0" rx="8" fill="#FFFFFF" stroke="#E1E0D9" stroke-width="1"/><rect x="432.0" y="96.0" width="384.0" height="250.0" rx="8" fill="#FFFFFF" stroke="#E1E0D9" stroke-width="1"/><rect x="832.0" y="96.0" width="384.0" height="250.0" rx="8" fill="#FFFFFF" stroke="#E1E0D9" stroke-width="1"/><rect x="32.0" y="372.0" width="760.0" height="290.0" rx="8" fill="#FFFFFF" stroke="#E1E0D9" stroke-width="1"/><rect x="808.0" y="372.0" width="440.0" height="290.0" rx="8" fill="#FFFFFF" stroke="#E1E0D9" stroke-width="1"/></g>
<g id="titulos"><text x="32.0" y="38.0" font-family="Segoe UI" font-size="29.3" font-weight="600" fill="#0B0B0B" text-anchor="start">Síntese</text><text x="32.0" y="64.0" font-family="Segoe UI" font-size="13.3" font-weight="400" fill="#52514E" text-anchor="start">Três achados e uma recomendação para o público do relatório</text><text x="32.0" y="700.0" font-family="Segoe UI" font-size="10.7" font-weight="400" fill="#898781" text-anchor="start">Fonte: IBGE — SIDRA, tabelas 1620, 1621, 1846 e 5932 (Contas Nacionais Trimestrais). Acesso em 20/10/2026. Projeto BI · Tema 12 · Evandro Miguel.</text><text x="52.0" y="132.0" font-family="Segoe UI" font-size="34.7" font-weight="700" fill="#2A78D6" text-anchor="start">1</text><text x="52.0" y="164.0" font-family="Segoe UI" font-size="17.3" font-weight="600" fill="#0B0B0B" text-anchor="start">Serviços sustentam o crescimento</text><text x="52.0" y="216.0" font-family="Segoe UI" font-size="13.3" font-weight="400" fill="#52514E" text-anchor="start">O setor responde por 69,5% do valor adicionado e</text><text x="52.0" y="235.9" font-family="Segoe UI" font-size="13.3" font-weight="400" fill="#52514E" text-anchor="start">contribuiu com +1,25 p.p. do crescimento de</text><text x="52.0" y="255.9" font-family="Segoe UI" font-size="13.3" font-weight="400" fill="#52514E" text-anchor="start">2025. É o setor decisivo para o nível de</text><text x="52.0" y="275.9" font-family="Segoe UI" font-size="13.3" font-weight="400" fill="#52514E" text-anchor="start">atividade, mas cresce a taxas moderadas: 2,41%</text><text x="52.0" y="295.8" font-family="Segoe UI" font-size="13.3" font-weight="400" fill="#52514E" text-anchor="start">a.a. entre 2000 e 2025.</text><text x="452.0" y="132.0" font-family="Segoe UI" font-size="34.7" font-weight="700" fill="#2A78D6" text-anchor="start">2</text><text x="452.0" y="164.0" font-family="Segoe UI" font-size="17.3" font-weight="600" fill="#0B0B0B" text-anchor="start">Agropecuária é pequena, mas a mais</text><text x="452.0" y="189.1" font-family="Segoe UI" font-size="17.3" font-weight="600" fill="#0B0B0B" text-anchor="start">dinâmica</text><text x="452.0" y="216.0" font-family="Segoe UI" font-size="13.3" font-weight="400" fill="#52514E" text-anchor="start">São 7,1% do valor adicionado e +0,78 p.p. em</text><text x="452.0" y="235.9" font-family="Segoe UI" font-size="13.3" font-weight="400" fill="#52514E" text-anchor="start">2025. No longo prazo cresce 3,71% a.a., o maior</text><text x="452.0" y="255.9" font-family="Segoe UI" font-size="13.3" font-weight="400" fill="#52514E" text-anchor="start">ritmo entre os três setores; em 2026-T2 avança</text><text x="452.0" y="275.9" font-family="Segoe UI" font-size="13.3" font-weight="400" fill="#52514E" text-anchor="start">6,8%.</text><text x="852.0" y="132.0" font-family="Segoe UI" font-size="34.7" font-weight="700" fill="#2A78D6" text-anchor="start">3</text><text x="852.0" y="164.0" font-family="Segoe UI" font-size="17.3" font-weight="600" fill="#0B0B0B" text-anchor="start">Indústria perde peso e a</text><text x="852.0" y="189.1" font-family="Segoe UI" font-size="17.3" font-weight="600" fill="#0B0B0B" text-anchor="start">transformação estagna</text><text x="852.0" y="216.0" font-family="Segoe UI" font-size="13.3" font-weight="400" fill="#52514E" text-anchor="start">A indústria caiu de 26,7% para 23,4% do valor</text><text x="852.0" y="235.9" font-family="Segoe UI" font-size="13.3" font-weight="400" fill="#52514E" text-anchor="start">adicionado em 25 anos e contribuiu com apenas</text><text x="852.0" y="255.9" font-family="Segoe UI" font-size="13.3" font-weight="400" fill="#52514E" text-anchor="start">+0,35 p.p. em 2025. Em 2026-T2, a transformação</text><text x="852.0" y="275.9" font-family="Segoe UI" font-size="13.3" font-weight="400" fill="#52514E" text-anchor="start">recua 0,9% enquanto a extrativa cresce 12,0%.</text><text x="52.0" y="410.0" font-family="Segoe UI" font-size="18.7" font-weight="600" fill="#0B0B0B" text-anchor="start">Recomendação</text><text x="52.0" y="446.0" font-family="Segoe UI" font-size="14.7" font-weight="400" fill="#52514E" text-anchor="start">Priorizar a leitura do crescimento por setor, e não apenas o número do PIB. O PIB de 2025</text><text x="52.0" y="468.8" font-family="Segoe UI" font-size="14.7" font-weight="400" fill="#52514E" text-anchor="start">cresceu 2,29%, mas a composição mostra serviços sustentando o nível e agropecuária puxando a</text><text x="52.0" y="491.6" font-family="Segoe UI" font-size="14.7" font-weight="400" fill="#52514E" text-anchor="start">margem. Para 2026, o avanço é positivo, porém concentrado em agropecuária, extrativa e</text><text x="52.0" y="514.4" font-family="Segoe UI" font-size="14.7" font-weight="400" fill="#52514E" text-anchor="start">informação/comunicação — a transformação industrial segue em queda. Como usar: comece pela</text><text x="52.0" y="537.1" font-family="Segoe UI" font-size="14.7" font-weight="400" fill="#52514E" text-anchor="start">visão geral para o nível, passe pela análise temporal para o ciclo e pela página de setores</text><text x="52.0" y="559.9" font-family="Segoe UI" font-size="14.7" font-weight="400" fill="#52514E" text-anchor="start">para identificar os motores. O ano de 2026 é parcial (apenas T1 e T2) e não deve ser lido</text><text x="52.0" y="582.7" font-family="Segoe UI" font-size="14.7" font-weight="400" fill="#52514E" text-anchor="start">como ano fechado.</text><text x="828.0" y="410.0" font-family="Segoe UI" font-size="18.7" font-weight="600" fill="#0B0B0B" text-anchor="start">Números para lembrar</text><text x="828.0" y="450.0" font-family="Segoe UI" font-size="13.3" font-weight="400" fill="#52514E" text-anchor="start">PIB nominal 2025</text><text x="1228.0" y="450.0" font-family="Segoe UI" font-size="14.7" font-weight="600" fill="#0B0B0B" text-anchor="end">R$ 12,74 trilhões</text><text x="828.0" y="486.0" font-family="Segoe UI" font-size="13.3" font-weight="400" fill="#52514E" text-anchor="start">PIB real 2025</text><text x="1228.0" y="486.0" font-family="Segoe UI" font-size="14.7" font-weight="600" fill="#0B0B0B" text-anchor="end">+2,29%</text><text x="828.0" y="522.0" font-family="Segoe UI" font-size="13.3" font-weight="400" fill="#52514E" text-anchor="start">CAGR 2000–2025</text><text x="1228.0" y="522.0" font-family="Segoe UI" font-size="14.7" font-weight="600" fill="#0B0B0B" text-anchor="end">2,26% a.a.</text><text x="828.0" y="558.0" font-family="Segoe UI" font-size="13.3" font-weight="400" fill="#52514E" text-anchor="start">PIB 2026-T2</text><text x="1228.0" y="558.0" font-family="Segoe UI" font-size="14.7" font-weight="600" fill="#0B0B0B" text-anchor="end">+2,0% YoY · +0,48% QoQ</text><text x="828.0" y="594.0" font-family="Segoe UI" font-size="13.3" font-weight="400" fill="#52514E" text-anchor="start">Serviços no VA</text><text x="1228.0" y="594.0" font-family="Segoe UI" font-size="14.7" font-weight="600" fill="#0B0B0B" text-anchor="end">69,5%</text></g>
<g id="interativos"><rect x="736.0" y="18.0" width="96.0" height="28.0" rx="6" fill="#FFFFFF" stroke="#E1E0D9" stroke-width="1"/><text x="784.0" y="36.5" font-family="Segoe UI" font-size="12.0" font-weight="400" fill="#52514E" text-anchor="middle">Capa</text><rect x="840.0" y="18.0" width="96.0" height="28.0" rx="6" fill="#FFFFFF" stroke="#E1E0D9" stroke-width="1"/><text x="888.0" y="36.5" font-family="Segoe UI" font-size="12.0" font-weight="400" fill="#52514E" text-anchor="middle">Visão geral</text><rect x="944.0" y="18.0" width="96.0" height="28.0" rx="6" fill="#FFFFFF" stroke="#E1E0D9" stroke-width="1"/><text x="992.0" y="36.5" font-family="Segoe UI" font-size="12.0" font-weight="400" fill="#52514E" text-anchor="middle">Temporal</text><rect x="1048.0" y="18.0" width="96.0" height="28.0" rx="6" fill="#FFFFFF" stroke="#E1E0D9" stroke-width="1"/><text x="1096.0" y="36.5" font-family="Segoe UI" font-size="12.0" font-weight="400" fill="#52514E" text-anchor="middle">Setores</text><rect x="1152.0" y="18.0" width="96.0" height="28.0" rx="6" fill="#2A78D6" stroke="none" stroke-width="1"/><text x="1200.0" y="36.5" font-family="Segoe UI" font-size="12.0" font-weight="400" fill="#FFFFFF" text-anchor="middle">Síntese</text></g>
<g id="conteudo"></g>
</svg>
