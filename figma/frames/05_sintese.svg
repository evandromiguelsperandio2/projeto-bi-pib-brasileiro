1.5" fill="none" stroke="#A9AEC6" stroke-width="1.4"/><rect x="45.0" y="270.0" width="6.0" height="6.0" rx="1.5" fill="none" stroke="#A9AEC6" stroke-width="1.4"/><rect x="53.0" y="270.0" width="6.0" height="6.0" rx="1.5" fill="none" stroke="#A9AEC6" stroke-width="1.4"/><text x="72.0" y="275.0" font-family="Segoe UI" font-size="11" font-weight="400" fill="#A9AEC6" text-anchor="start">Visão geral</text><path d="M45,329 L45,315 M47,325 L51,321 L54,324 L60,317" stroke="#A9AEC6" fill="none" stroke-width="1.6"/><text x="72.0" y="327.0" font-family="Segoe UI" font-size="11" font-weight="400" fill="#A9AEC6" text-anchor="start">Temporal</text><rect x="46.0" y="374.0" width="3.0" height="7.0" rx="1" fill="#A9AEC6" stroke="none" stroke-width="1"/><rect x="51.0" y="370.0" width="3.0" height="11.0" rx="1" fill="#A9AEC6" stroke="none" stroke-width="1"/><rect x="56.0" y="367.0" width="3.0" height="14.0" rx="1" fill="#A9AEC6" stroke="none" stroke-width="1"/><text x="72.0" y="379.0" font-family="Segoe UI" font-size="11" font-weight="400" fill="#A9AEC6" text-anchor="start">Setores</text><rect x="28.0" y="404.0" width="188.0" height="44.0" rx="12" fill="#2A78D6" stroke="none" stroke-width="1"/><rect x="47.0" y="419.0" width="12.0" height="15.0" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.4"/><line x1="50.0" y1="424.0" x2="56.0" y2="424.0" stroke="#FFFFFF" stroke-width="1.2"/><line x1="50.0" y1="427.0" x2="56.0" y2="427.0" stroke="#FFFFFF" stroke-width="1.2"/><line x1="50.0" y1="430.0" x2="56.0" y2="430.0" stroke="#FFFFFF" stroke-width="1.2"/><text x="72.0" y="431.0" font-family="Segoe UI" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="start">Síntese</text><line x1="32.0" y1="596.0" x2="212.0" y2="596.0" stroke="#2A2F47" stroke-width="1"/><text x="40.0" y="620.0" font-family="Segoe UI" font-size="8" font-weight="400" fill="#6C728E" text-anchor="start">Dados até 2026-T2</text><text x="40.0" y="634.0" font-family="Segoe UI" font-size="8" font-weight="400" fill="#6C728E" text-anchor="start">Atualizado 20/10/2026</text><rect x="40.0" y="650.0" width="6.0" height="6.0" rx="3" fill="#1BAF7A" stroke="none" stroke-width="1"/><text x="52.0" y="656.0" font-family="Segoe UI" font-size="8" font-weight="400" fill="#6C728E" text-anchor="start">Base validada</text><text x="40.0" y="676.0" font-family="Segoe UI" font-size="8" font-weight="400" fill="#4E5470" text-anchor="start">v1.0 · Tema 12</text><rect x="1108.0" y="32.0" width="140.0" height="28.0" rx="14" fill="#FFFFFF" stroke="#E4E6EB" stroke-width="1"/><rect x="1122.0" y="43.0" width="6.0" height="6.0" rx="3" fill="#1BAF7A" stroke="none" stroke-width="1"/><text x="1134.0" y="51.0" font-family="Segoe UI" font-size="12.0" font-weight="400" fill="#4B5563" text-anchor="start">2026-T2</text><line x1="272.0" y1="96.0" x2="1248.0" y2="96.0" stroke="#E4E6EB" stroke-width="1"/><rect x="272.0" y="112.0" width="314.0" height="240.0" rx="12" fill="#FFFFFF" stroke="#E6E8EE" stroke-width="1"/><rect x="602.0" y="112.0" width="314.0" height="240.0" rx="12" fill="#FFFFFF" stroke="#E6E8EE" stroke-width="1"/><rect x="932.0" y="112.0" width="314.0" height="240.0" rx="12" fill="#FFFFFF" stroke="#E6E8EE" stroke-width="1"/><rect x="272.0" y="368.0" width="640.0" height="264.0" rx="12" fill="#FFFFFF" stroke="#E6E8EE" stroke-width="1"/><rect x="928.0" y="368.0" width="320.0" height="264.0" rx="12" fill="#FFFFFF" stroke="#E6E8EE" stroke-width="1"/></g>
<g id="titulos"><text x="272.0" y="56.0" font-family="Segoe UI" font-size="29.3" font-weight="600" fill="#111827" text-anchor="start">Síntese</text><text x="272.0" y="80.0" font-family="Segoe UI" font-size="13.3" font-weight="400" fill="#4B5563" text-anchor="start">Três achados e uma recomendação para o público do relatório</text><text x="292.0" y="146.0" font-family="Segoe UI" font-size="32.0" font-weight="700" fill="#2A78D6" text-anchor="start">1</text><text x="292.0" y="176.0" font-family="Segoe UI" font-size="15.3" font-weight="600" fill="#111827" text-anchor="start">Serviços sustentam o crescimento</text><text x="292.0" y="224.0" font-family="Segoe UI" font-size="12.3" font-weight="400" fill="#4B5563" text-anchor="start">O setor responde por 69,5% do valor</text><text x="292.0" y="242.4" font-family="Segoe UI" font-size="12.3" font-weight="400" fill="#4B5563" text-anchor="start">adicionado e contribuiu com +1,25 p.p. do</text><text x="292.0" y="260.9" font-family="Segoe UI" font-size="12.3" font-weight="400" fill="#4B5563" text-anchor="start">crescimento de 2025. É o setor decisivo</text><text x="292.0" y="279.4" font-family="Segoe UI" font-size="12.3" font-weight="400" fill="#4B5563" text-anchor="start">para o nível de atividade, mas cresce a</text><text x="292.0" y="297.8" font-family="Segoe UI" font-size="12.3" font-weight="400" fill="#4B5563" text-anchor="start">taxas moderadas: 2,41% a.a. entre 2000 e</text><text x="292.0" y="316.2" font-family="Segoe UI" font-size="12.3" font-weight="400" fill="#4B5563" text-anchor="start">2025.</text><text x="622.0" y="146.0" font-family="Segoe UI" font-size="32.0" font-weight="700" fill="#2A78D6" text-anchor="start">2</text><text x="622.0" y="176.0" font-family="Segoe UI" font-size="15.3" font-weight="600" fill="#111827" text-anchor="start">Agropecuária é pequena, mas a</text><text x="622.0" y="198.2" font-family="Segoe UI" font-size="15.3" font-weight="600" fill="#111827" text-anchor="start">mais dinâmica</text><text x="622.0" y="224.0" font-family="Segoe UI" font-size="12.3" font-weight="400" fill="#4B5563" text-anchor="start">São 7,1% do valor adicionado e +0,78 p.p.</text><text x="622.0" y="242.4" font-family="Segoe UI" font-size="12.3" font-weight="400" fill="#4B5563" text-anchor="start">em 2025. No longo prazo cresce 3,71% a.a.,</text><text x="622.0" y="260.9" font-family="Segoe UI" font-size="12.3" font-weight="400" fill="#4B5563" text-anchor="start">o maior ritmo entre os três setores; em</text><text x="622.0" y="279.4" font-family="Segoe UI" font-size="12.3" font-weight="400" fill="#4B5563" text-anchor="start">2026-T2 avança 6,8%.</text><text x="952.0" y="146.0" font-family="Segoe UI" font-size="32.0" font-weight="700" fill="#2A78D6" text-anchor="start">3</text><text x="952.0" y="176.0" font-family="Segoe UI" font-size="15.3" font-weight="600" fill="#111827" text-anchor="start">Indústria perde peso e a</text><text x="952.0" y="198.2" font-family="Segoe UI" font-size="15.3" font-weight="600" fill="#111827" text-anchor="start">transformação estagna</text><text x="952.0" y="224.0" font-family="Segoe UI" font-size="12.3" font-weight="400" fill="#4B5563" text-anchor="start">A indústria caiu de 26,7% para 23,4% do</text><text x="952.0" y="242.4" font-family="Segoe UI" font-size="12.3" font-weight="400" fill="#4B5563" text-anchor="start">valor adicionado em 25 anos e contribuiu</text><text x="952.0" y="260.9" font-family="Segoe UI" font-size="12.3" font-weight="400" fill="#4B5563" text-anchor="start">com apenas +0,35 p.p. em 2025. Em 2026-T2,</text><text x="952.0" y="279.4" font-family="Segoe UI" font-size="12.3" font-weight="400" fill="#4B5563" text-anchor="start">a transformação recua 0,9% enquanto a</text><text x="952.0" y="297.8" font-family="Segoe UI" font-size="12.3" font-weight="400" fill="#4B5563" text-anchor="start">extrativa cresce 12,0%.</text><text x="292.0" y="406.0" font-family="Segoe UI" font-size="17.3" font-weight="600" fill="#111827" text-anchor="start">Recomendação</text><text x="292.0" y="442.0" font-family="Segoe UI" font-size="13.6" font-weight="400" fill="#4B5563" text-anchor="start">Priorizar a leitura do crescimento por setor, e não apenas o número do PIB. O PIB</text><text x="292.0" y="463.1" font-family="Segoe UI" font-size="13.6" font-weight="400" fill="#4B5563" text-anchor="start">de 2025 cresceu 2,29%, mas a composição mostra serviços sustentando o nível e</text><text x="292.0" y="484.2" font-family="Segoe UI" font-size="13.6" font-weight="400" fill="#4B5563" text-anchor="start">agropecuária puxando a margem. Para 2026, o avanço é positivo, porém concentrado em</text><text x="292.0" y="505.2" font-family="Segoe UI" font-size="13.6" font-weight="400" fill="#4B5563" text-anchor="start">agropecuária, extrativa e informação/comunicação — a transformação industrial segue</text><text x="292.0" y="526.3" font-family="Segoe UI" font-size="13.6" font-weight="400" fill="#4B5563" text-anchor="start">em queda. Como usar: comece pela visão geral para o nível, passe pela análise</text><text x="292.0" y="547.4" font-family="Segoe UI" font-size="13.6" font-weight="400" fill="#4B5563" text-anchor="start">temporal para o ciclo e pela página de setores para identificar os motores. O ano</text><text x="292.0" y="568.5" font-family="Segoe UI" font-size="13.6" font-weight="400" fill="#4B5563" text-anchor="start">de 2026 é parcial (apenas T1 e T2) e não deve ser lido como ano fechado.</text><text x="948.0" y="406.0" font-family="Segoe UI" font-size="17.3" font-weight="600" fill="#111827" text-anchor="start">Números para lembrar</text><text x="948.0" y="446.0" font-family="Segoe UI" font-size="12.0" font-weight="400" fill="#4B5563" text-anchor="start">PIB nominal 2025</text><text x="1228.0" y="446.0" font-family="Segoe UI" font-size="13.3" font-weight="600" fill="#111827" text-anchor="end">R$ 12,74 tri</text><text x="948.0" y="480.0" font-family="Segoe UI" font-size="12.0" font-weight="400" fill="#4B5563" text-anchor="start">PIB real 2025</text><text x="1228.0" y="480.0" font-family="Segoe UI" font-size="13.3" font-weight="600" fill="#111827" text-anchor="end">+2,29%</text><text x="948.0" y="514.0" font-family="Segoe UI" font-size="12.0" font-weight="400" fill="#4B5563" text-anchor="start">CAGR 2000–2025</text><text x="1228.0" y="514.0" font-family="Segoe UI" font-size="13.3" font-weight="600" fill="#111827" text-anchor="end">2,26% a.a.</text><text x="948.0" y="548.0" font-family="Segoe UI" font-size="12.0" font-weight="400" fill="#4B5563" text-anchor="start">PIB 2026-T2</text><text x="1228.0" y="548.0" font-family="Segoe UI" font-size="13.3" font-weight="600" fill="#111827" text-anchor="end">+2,0% / +0,48%</text><text x="948.0" y="582.0" font-family="Segoe UI" font-size="12.0" font-weight="400" fill="#4B5563" text-anchor="start">Serviços no VA</text><text x="1228.0" y="582.0" font-family="Segoe UI" font-size="13.3" font-weight="600" fill="#111827" text-anchor="end">69,5%</text><text x="272.0" y="688.0" font-family="Segoe UI" font-size="10.7" font-weight="400" fill="#8A90A2" text-anchor="start">Fonte: IBGE — SIDRA, tabelas 1620, 1621, 1846 e 5932 (Contas Nacionais Trimestrais). Acesso em 20/10/2026. Projeto BI · Tema 12 · Evandro Miguel.</text></g>
