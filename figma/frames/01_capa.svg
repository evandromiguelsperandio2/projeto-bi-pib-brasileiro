<g id="titulos"><text x="296.0" y="190.0" font-family="Segoe UI" font-size="58.7" font-weight="700" fill="#FFFFFF" text-anchor="start">PIB Brasileiro</text><text x="296.0" y="232.0" font-family="Segoe UI" font-size="26.7" font-weight="400" fill="#A9AEC6" text-anchor="start">Evolução e participação setorial ·</text><text x="296.0" y="262.0" font-family="Segoe UI" font-size="26.7" font-weight="400" fill="#A9AEC6" text-anchor="start">2000-T1 a 2026-T2</text><text x="296.0" y="310.0" font-family="Segoe UI" font-size="18.7" font-weight="400" fill="#D6DAE8" text-anchor="start">Como o PIB brasileiro evoluiu e como os principais</text><text x="296.0" y="337.1" font-family="Segoe UI" font-size="18.7" font-weight="400" fill="#D6DAE8" text-anchor="start">setores participaram desse desempenho?</text><text x="316.0" y="400.0" font-family="Segoe UI" font-size="12.0" font-weight="400" fill="#A9AEC6" text-anchor="start">PIB nominal 2025 · R$ trilhões</text><text x="296.0" y="510.0" font-family="Segoe UI" font-size="12.0" font-weight="400" fill="#8E94AC" text-anchor="start">Dados públicos. O relatório usa índices de volume para o crescimento real e</text><text x="296.0" y="527.4" font-family="Segoe UI" font-size="12.0" font-weight="400" fill="#8E94AC" text-anchor="start">valores correntes apenas para participação e nível.</text><text x="296.0" y="670.0" font-family="Segoe UI" font-size="10.7" font-weight="400" fill="#6C728E" text-anchor="start">Fonte: IBGE — SIDRA, tabelas 1620, 1621, 1846 e 5932. Acesso em 20/10/2026.</text></g>
